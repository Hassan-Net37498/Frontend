<h2 class="text-center mb-4">Edit User</h2>
<form (ngSubmit)="save()" #editUserForm="ngForm" novalidate>

  <div class="mb-3">
    <label for="name" class="form-label">Name</label>
    <input
      type="text"
      class="form-control"
      id="name"
      name="name"
      [(ngModel)]="userData.fullName"
      required
      />
    <div *ngIf="editUserForm.submitted && !userData.fullName" class="text-danger mt-1">
      Name is required
    </div>
  </div>

  <div class="mb-3">
    <label for="email" class="form-label">Email</label>
    <input
      type="email"
      class="form-control"
      id="email"
      name="email"
      [(ngModel)]="userData.email"
      required
      />
    <div *ngIf="editUserForm.submitted && !userData.email" class="text-danger mt-1">
      Email is required
    </div>
  </div>

 

  

  <div class="mb-3">
    <label for="phone" class="form-label">Phone</label>
    <input
      type="text"
      class="form-control"
      id="phone"
      name="phone"
      [(ngModel)]="userData.phoneNumber"
      />
  </div>

  <div class="d-flex justify-content-between">
    <button type="button" class="btn btn-secondary" (click)="cancel()">Cancel</button>
    <button type="submit" class="btn btn-primary">Save</button>
  </div>
</form>
